<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom CMS &amp; AI Page Builder — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Quicksand:wght@400;700&family=Poppins:wght@400;700;800&family=Merriweather:wght@400;700&family=Inter:wght@400;700;800&family=Montserrat:wght@400;700;800&family=Raleway:wght@400;700&family=Lato:wght@400;700&family=Playfair+Display:wght@400;700;800&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif;background:#FAFAF9;color:#1C1917;font-size:14px;line-height:1.5}
header{background:#DC2626;color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;z-index:10}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-mark{width:34px;height:34px;background:#fff;color:#DC2626;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;flex-shrink:0}
.logo{font-size:20px;font-weight:800;font-style:italic;letter-spacing:-.5px;color:#fff;line-height:1.1}
.logo-tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.85);margin-top:2px}
.demo-badge{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.2);padding:5px 12px;border-radius:6px;color:#fff;white-space:nowrap}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 28px;background:#fff;position:sticky;top:0;z-index:150;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.lamp-nav-wrap{justify-self:center}
.lamp-nav{position:relative;display:flex;gap:2px;background:rgba(0,0,0,.035);border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:5px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.lamp-item{position:relative;z-index:2;border:none;background:none;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;color:#666;cursor:pointer;display:flex;align-items:center;gap:6px;transition:color .2s;white-space:nowrap}
.lamp-item.active{color:#fff}
.lamp-item:hover:not(.active){color:#DC2626}
.lamp-ico{font-size:14px;line-height:1}
.lamp-highlight{position:absolute;top:5px;bottom:5px;border-radius:999px;background:#DC2626;transition:left .35s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1);z-index:1}
@media(max-width:820px){.lamp-label{display:none}.lamp-item{padding:9px 13px}.topbar{padding:10px 12px}}
main{width:100%;margin:24px 0 60px;padding:0 32px;box-sizing:border-box}
.section{display:none}.section.active{display:block}
.card{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:22px;margin-bottom:20px}
.card-title{font-size:13px;font-weight:700;color:#DC2626;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #F5F5F4;letter-spacing:.4px;text-transform:uppercase}
.muted{color:#78716C}
.faint{color:#A8A29E}
.hero{background:linear-gradient(135deg,#FEF2F2,#FAFAF9);border:1px solid #FCA5A5}
.hero h1{font-size:24px;font-weight:800;color:#1C1917;margin-bottom:6px}
.hero p{font-size:14px;color:#57534E;max-width:640px}
.hero-note{margin-top:14px;font-size:12px;color:#A8A29E;font-style:italic}
.btn{padding:9px 18px;border:none;border-radius:7px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;letter-spacing:.2px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:#DC2626;color:#fff}.btn-primary:hover{background:#B91C1C}
.btn-primary:disabled{background:#E7E5E4;color:#A8A29E;cursor:not-allowed}
.btn-secondary{background:#F5F5F4;color:#44403C}.btn-secondary:hover{background:#E7E5E4}
.btn-sm{padding:6px 13px;font-size:12px}
.btn-outline{background:#fff;border:1.5px solid #DC2626;color:#DC2626}
.btn-outline:hover{background:#FEF2F2}
.btn-ghost{background:none;border:1px solid #E7E5E4;color:#57534E}
.btn-ghost:hover{border-color:#DC2626;color:#DC2626}
.btn-ghost.active{background:#DC2626;color:#fff;border-color:#DC2626}
input[type=text],select,textarea{padding:9px 12px;border:1.5px solid #E7E5E4;border-radius:6px;font-size:13.5px;color:#1C1917;background:#fff;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.08)}
label{font-size:11px;font-weight:700;color:#78716C;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;display:block}

/* Dashboard stats */
.stats-card{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-item{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:16px 18px}
.stat-item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stat-item-title{font-size:11.5px;font-weight:700;color:#78716C;text-transform:uppercase;letter-spacing:.4px}
.stat-icon-chip{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
.accent-red{background:#FEF2F2}.accent-green{background:#F0FDF4}.accent-amber{background:#FFFBEB}.accent-blue{background:#EFF6FF}
.stat-value{font-size:26px;font-weight:800;color:#1C1917}
.stat-sub{font-size:11.5px;color:#A8A29E;margin-top:2px}
@media(max-width:760px){.stats-card{grid-template-columns:1fr 1fr}}

/* Toolbar / search */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar-left{display:flex;gap:10px;flex:1;flex-wrap:wrap}
.search-wrap{position:relative;max-width:280px;flex:1;min-width:180px}
.search-wrap input{padding-left:30px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#A8A29E;font-size:13px}
.toolbar select{width:auto;max-width:170px}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px}
th{background:#F5F5F4;padding:8px 10px;text-align:left;font-weight:700;color:#57534E;border-bottom:2px solid #E7E5E4;white-space:nowrap;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
td{padding:9px 10px;border-bottom:1px solid #F5F5F4;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FAFAF9}
tbody tr.selected{background:#FEF2F2}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px}
.status-badge.published{background:#DCFCE7;color:#166534}
.status-badge.draft{background:#FFF8F1;color:#B5621E}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.section-type-chip{display:inline-block;font-size:10px;font-weight:700;background:#F5F5F4;color:#78716C;border-radius:8px;padding:2px 7px;margin:2px 3px 0 0}
.action-links{display:flex;gap:10px}
.action-link{font-size:12px;font-weight:700;color:#78716C;cursor:pointer}
.action-link:hover{color:#DC2626}
.action-link.danger:hover{color:#B91C1C}

/* Detail panel (slide from right) */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:400}
.overlay.show{display:block}
.detail-panel{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:401;transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:24px}
.detail-panel.open{transform:translateX(0)}
.panel-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.panel-title{font-size:17px;font-weight:800;color:#1C1917}
.panel-slug{font-size:12.5px;color:#78716C;margin-top:3px;font-family:monospace}
.close-btn{background:none;border:none;font-size:18px;color:#A8A29E;cursor:pointer;line-height:1}
.close-btn:hover{color:#1C1917}
.panel-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#FAFAF9;border:1px solid #F5F5F4;border-radius:8px;padding:14px;margin-bottom:16px}
.meta-label{font-size:10px;font-weight:700;color:#A8A29E;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.meta-value{font-size:13px;font-weight:600;color:#1C1917}
.panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.panel-sections-title{font-size:11px;font-weight:700;color:#78716C;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;border-top:1px solid #F5F5F4;padding-top:16px}
.section-item{display:flex;align-items:flex-start;gap:10px;border:1px solid #F5F5F4;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.section-order{width:20px;height:20px;border-radius:5px;background:#F5F5F4;color:#78716C;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-body{flex:1;min-width:0}
.section-comp{font-size:11.5px;font-weight:700;color:#1C1917;font-family:monospace}
.json-toggle-btn{background:none;border:none;color:#DC2626;font-size:11px;font-weight:700;cursor:pointer;padding:0;margin-top:4px}
.json-block{display:none;background:#1C1917;color:#D6D3D1;font-family:monospace;font-size:10.5px;padding:10px;border-radius:6px;margin-top:6px;white-space:pre-wrap;max-height:180px;overflow-y:auto}
.json-block.open{display:block}

/* Builder */
.builder-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.builder-title{font-size:15px;font-weight:800;flex:1;min-width:160px}
.builder-title .sub{font-size:11.5px;font-weight:600;color:#A8A29E;font-family:monospace;margin-top:1px}
.viewport-toggle{display:flex;gap:2px;background:#F5F5F4;border-radius:8px;padding:3px}
.viewport-toggle button{border:none;background:none;padding:6px 12px;font-size:12px;font-weight:700;border-radius:6px;cursor:pointer;color:#78716C}
.viewport-toggle button.active{background:#fff;color:#DC2626;box-shadow:0 1px 3px rgba(0,0,0,.12)}

.builder-layout{display:grid;grid-template-columns:240px 1fr 380px;gap:20px;align-items:start}
.palette{position:sticky;top:70px;background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:16px}
.palette-title{font-size:11px;font-weight:700;color:#78716C;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.palette-item{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#44403C;margin-bottom:4px}
.palette-item:hover{background:#FEF2F2;color:#DC2626}
.palette-ico{font-size:16px;width:20px;text-align:center}

.canvas-outer{min-width:0}
.canvas{background:#fff;border:1px solid #E7E5E4;border-radius:12px;padding:26px;transition:max-width .25s ease}
.canvas.mobile{max-width:375px;margin:0 auto;border:8px solid #292524;border-radius:26px;padding:14px}
.canvas-empty{text-align:center;padding:50px 20px;color:#A8A29E}
.canvas-empty .ico{font-size:28px;margin-bottom:8px}

.section-block{position:relative;border:1.5px dashed transparent;border-radius:10px;margin-bottom:14px;transition:border-color .15s;cursor:pointer}
.section-block:hover{border-color:#FCA5A5}
.section-block.selected{border-style:solid;border-color:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.1)}
.section-block.dragging{opacity:.4}
.section-block.drag-over-top{box-shadow:inset 0 3px 0 #DC2626}
.section-block.drag-over-bottom{box-shadow:inset 0 -3px 0 #DC2626}
.section-block.hidden-section{opacity:.4}
.sec-toolbar{position:absolute;top:6px;right:6px;display:flex;gap:3px;background:#fff;border:1px solid #E7E5E4;border-radius:8px;padding:3px;opacity:0;transition:opacity .15s;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.section-block:hover .sec-toolbar{opacity:1}
.sec-tbtn{width:24px;height:24px;border:none;background:none;border-radius:5px;font-size:12px;cursor:pointer;color:#78716C;display:flex;align-items:center;justify-content:center}
.sec-tbtn:hover{background:#F5F5F4;color:#DC2626}
.sec-handle{cursor:grab}
.sec-tag{position:absolute;top:6px;left:6px;background:rgba(28,25,23,.75);color:#fff;font-size:9.5px;font-family:monospace;padding:2px 7px;border-radius:5px;opacity:0;transition:opacity .15s;z-index:5}
.section-block:hover .sec-tag{opacity:1}

.sec-hero{background:linear-gradient(135deg,#DC2626,#7F1D1D);border-radius:10px;padding:44px 30px;text-align:center;color:#fff}
.sec-hero h1{font-size:26px;font-weight:800;margin-bottom:8px}
.sec-hero p{font-size:14px;color:rgba(255,255,255,.88);max-width:480px;margin:0 auto 16px}
.sec-hero .btn{background:#fff;color:#B91C1C}
.canvas.mobile .sec-hero{padding:28px 16px}.canvas.mobile .sec-hero h1{font-size:19px}

.sec-pad{padding:26px 6px}
.sec-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.canvas.mobile .sec-cards{grid-template-columns:1fr}
.mini-card{background:#FAFAF9;border:1px solid #F5F5F4;border-radius:9px;padding:16px;text-align:center}
.mini-card .ico{font-size:22px;margin-bottom:8px}
.mini-card h4{font-size:13px;font-weight:800;margin-bottom:5px}
.mini-card p{font-size:11.5px;color:#78716C}

.mini-card.mini-card-imagetop{padding:0;overflow:hidden;text-align:left}
.mini-card-img{width:100%;height:100px;object-fit:cover;display:block}
.mini-card-img-empty{width:100%;height:100px;background:#F5F5F4;display:flex;align-items:center;justify-content:center;font-size:22px}
.mini-card-body{padding:14px}
.mini-card.mini-card-imagetop h4{margin-bottom:4px}

.mini-card.mini-card-hover{position:relative;overflow:hidden;height:170px;padding:0;border:none;text-align:left;background-size:cover;background-position:center;background-color:#E7E5E4;box-shadow:0 8px 20px rgba(0,0,0,.12);transform:scale(1);opacity:1;filter:blur(0);transition:transform .5s ease-in-out,opacity .5s ease-in-out,filter .5s ease-in-out}
.sec-cards-hover:hover .mini-card.mini-card-hover{transform:scale(.97);opacity:.6;filter:blur(2px)}
.mini-card.mini-card-hover:hover{transform:scale(1.05) !important;opacity:1 !important;filter:blur(0) !important;z-index:2}
.mini-card-hover .hover-scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,.4) 55%, transparent)}
.mini-card-hover .hover-text{position:absolute;left:0;bottom:0;right:0;padding:12px 14px;color:#fff}
.mini-card-hover .hover-sub{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85;margin-bottom:2px}
.mini-card-hover h4{color:#fff;margin-bottom:0}

.sec-cards.sec-cards-wide{grid-template-columns:1fr}
.mini-card.mini-card-wide{display:flex;align-items:center;gap:16px;text-align:left;padding:14px}
.mini-card-wide-img{width:72px;height:72px;flex-shrink:0;border-radius:8px;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:24px}
.mini-card-wide-img-wrap{width:72px;height:72px;flex-shrink:0;border-radius:8px;overflow:hidden}
.mini-card-wide-img-wrap .mini-card-wide-img{width:100%;height:100%}
.mini-card.mini-card-wide .mini-card-body{padding:0}

.mini-card.mini-card-testimonial{background:#FAFAF9;border:none;border-left:3px solid #DC2626;text-align:left;padding:16px}
.mini-card-testimonial blockquote{font-size:12.5px;font-style:italic;color:#292524;margin-bottom:8px;line-height:1.5}
.mini-card-testimonial .who{font-size:11px;font-weight:700;color:#78716C}

.sec-rich h2{font-size:18px;font-weight:800;margin-bottom:8px}
.sec-rich p{font-size:13px;color:#57534E;line-height:1.7}

.sec-callout{border-radius:9px;padding:18px 20px}
.sec-callout.tone-info{background:#EFF6FF;border:1.5px solid #BFDBFE}
.sec-callout.tone-warn{background:#FFF8F1;border:1.5px solid #FDE7CC}
.sec-callout.tone-success{background:#F0FDF4;border:1.5px solid #BBF7D0}
.sec-callout h4{font-size:13px;font-weight:800;margin-bottom:5px}
.sec-callout p{font-size:12.5px;color:#44403C}

.sec-testi{background:#FAFAF9;border-left:4px solid #DC2626;border-radius:8px;padding:20px 22px}
.sec-testi blockquote{font-size:15px;font-style:italic;color:#292524;margin-bottom:10px}
.sec-testi .who{font-size:12px;font-weight:700;color:#78716C}

.sec-books{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.canvas.mobile .sec-books{grid-template-columns:repeat(2,1fr)}
.book-tile{background:#F5F5F4;border-radius:7px;padding:10px 8px;text-align:center}
.book-cover{height:70px;border-radius:5px;background:linear-gradient(135deg,#DC2626,#F59E0B);margin-bottom:6px}
.book-tile .t{font-size:10.5px;font-weight:700;color:#1C1917}
.book-tile .a{font-size:9.5px;color:#A8A29E}

.sec-cta{background:#1C1917;color:#fff;border-radius:9px;padding:26px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.sec-cta h3{font-size:16px;font-weight:800}
.canvas.mobile .sec-cta{flex-direction:column;text-align:center}

.sec-form{background:#FAFAF9;border:1px solid #F5F5F4;border-radius:9px;padding:20px}
.sec-form h4{font-size:14px;font-weight:800;margin-bottom:12px}
.fake-field{background:#fff;border:1.5px solid #E7E5E4;border-radius:6px;padding:9px 12px;font-size:12px;color:#A8A29E;margin-bottom:8px}

.sec-image img{max-width:100%}
.sec-image-caption{font-size:12px;color:#78716C;margin-top:8px;text-align:center}
.sec-image-empty{text-align:center;padding:36px 20px;color:#A8A29E;background:#FAFAF9;border:1.5px dashed #E7E5E4;border-radius:10px;font-size:13px}
.sec-image-empty .ico{font-size:24px;margin-bottom:6px;display:block}
.img-upload-zone{border:1.5px dashed #E7E5E4;border-radius:9px;cursor:pointer;overflow:hidden;background:#FAFAF9;transition:border-color .15s}
.img-upload-zone:hover{border-color:#DC2626}
.img-upload-zone img{display:block;width:100%;max-height:180px;object-fit:cover}
.img-upload-empty{padding:28px 14px;text-align:center;color:#A8A29E;font-size:12px;font-weight:600}
.img-upload-empty .ico{font-size:22px;display:block;margin-bottom:6px}

.has-photo-bg{color:#fff}
.has-photo-bg > h1, .has-photo-bg > h2, .has-photo-bg > h3, .has-photo-bg > h4, .has-photo-bg > p, .has-photo-bg > blockquote, .has-photo-bg > .who{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.sec-pad.has-photo-bg{padding:26px 20px;border-radius:10px}

/* Editor panel (docked) — Content / Style / Spacing, mirrors PageChatbox's Edit tab */
.editor-panel{background:#fff;border:1px solid #E7E5E4;border-radius:12px;display:flex;flex-direction:column;position:sticky;top:70px}
.editor-panel-header{padding:14px 18px;border-bottom:1px solid #E7E5E4;background:#FAFAF9;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:10px}
.editor-panel-title{font-size:14px;font-weight:800;color:#1C1917;display:flex;align-items:center;gap:10px;min-width:0}
.editor-panel-title .bar{width:4px;height:26px;border-radius:2px;background:#DC2626;flex-shrink:0}
.editor-panel-title-text{min-width:0}
.editor-sel-badge{font-size:10px;font-weight:700;color:#78716C;background:#F5F5F4;border-radius:999px;padding:2px 9px;margin-top:4px;display:inline-block;font-family:monospace;white-space:nowrap}
.editor-panel-actions{display:flex;gap:6px;flex-shrink:0}
.editor-icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid #E7E5E4;background:#fff;cursor:pointer;font-size:14px;color:#44403C;display:flex;align-items:center;justify-content:center}
.editor-icon-btn:hover:not(:disabled){border-color:#DC2626;color:#DC2626}
.editor-icon-btn:disabled{opacity:.35;cursor:not-allowed}
.editor-tabbar{display:flex;gap:4px;padding:10px 12px;background:#FAFAF9;border-bottom:1px solid #E7E5E4;flex-shrink:0}
.editor-tabbtn{flex:1;padding:8px 4px;border-radius:7px;border:none;background:transparent;color:#78716C;font-size:12.5px;font-weight:700;cursor:pointer}
.editor-tabbtn.active{background:#1C1917;color:#fff}
.editor-panel-body{flex:1}
.editor-empty{padding:44px 24px;text-align:center;color:#A8A29E;font-size:13px;line-height:1.7}
.editor-empty .ico{font-size:30px;margin-bottom:12px}
.editor-body{padding:18px}
.edit-field{margin-bottom:16px}
.card-group{border:1px solid #F5F5F4;border-radius:8px;margin-bottom:10px;background:#FAFAF9;overflow:hidden}
.card-group-title{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:none;background:transparent;cursor:pointer;font-size:10.5px;font-weight:800;color:#A8A29E;text-transform:uppercase;letter-spacing:.4px}
.card-group-title:hover{background:#F5F5F4}
.card-group-chevron{font-size:9px;color:#A8A29E;transition:transform .15s}
.card-group:not(.collapsed) .card-group-chevron{transform:rotate(90deg)}
.card-group-body{padding:0 12px 12px}
.card-group.collapsed .card-group-body{display:none}
.style-group{border:1px solid #E7E5E4;border-radius:9px;margin-bottom:12px;overflow:hidden}
.style-group-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:#FAFAF9;border:none;cursor:pointer;font-size:12.5px;font-weight:800;color:#1C1917}
.style-group-header:hover{background:#F5F5F4}
.style-group-title{display:flex;align-items:center;gap:8px}
.style-group-chevron{font-size:10px;color:#A8A29E;transition:transform .15s}
.style-group:not(.collapsed) .style-group-chevron{transform:rotate(90deg)}
.style-group-body{padding:16px 14px 2px;background:#fff}
.style-group.collapsed .style-group-body{display:none}
.seg-row{display:flex;gap:2px;background:#F5F5F4;border-radius:7px;padding:3px}
.seg-btn{flex:1;border:none;background:transparent;padding:7px 10px;border-radius:5px;font-size:12px;font-weight:700;color:#78716C;cursor:pointer}
.seg-btn.active{background:#fff;color:#DC2626;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.variant-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.variant-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:1.5px solid #E7E5E4;border-radius:8px;background:#fff;font-size:11px;font-weight:700;color:#78716C;cursor:pointer}
.variant-btn:hover{border-color:#FCA5A5}
.variant-btn.active{border-color:#DC2626;color:#DC2626;background:#FEF2F2}
.variant-ico{font-size:16px}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:#DC2626}
.range-val{font-size:12px;font-weight:700;color:#78716C;font-family:monospace;width:40px;text-align:right;flex-shrink:0}
.style-note{font-size:11.5px;color:#A8A29E;margin-top:2px}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#44403C;cursor:pointer}
.toggle-row input[type=checkbox]{width:15px;height:15px;accent-color:#DC2626;cursor:pointer}
.wheel-row{display:flex;align-items:center;gap:10px}
.wheel-row input[type=color]{width:42px;height:34px;border:1.5px solid #E7E5E4;border-radius:8px;padding:2px;cursor:pointer;background:#fff;flex-shrink:0}
.wheel-row input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.wheel-row input[type=color]::-webkit-color-swatch{border-radius:5px;border:none}

.toast{position:fixed;bottom:24px;right:24px;background:#222;color:#fff;padding:11px 20px;border-radius:6px;font-size:13px;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:340px}
.toast.show{opacity:1}
@media(max-width:1500px){.builder-layout{grid-template-columns:1fr}.palette,.editor-panel{position:static;height:auto;min-height:0}.sec-cards,.sec-books{grid-template-columns:1fr 1fr}}
</style>

<body>

<div class="topbar">
  <div></div>
  <div class="lamp-nav-wrap">
    <nav class="lamp-nav" id="lampNav">
      <div class="lamp-highlight" id="lampHighlight"></div>
      <button class="lamp-item active" data-tab="home" onclick="showSection('home',this)"><span class="lamp-ico">&#127968;</span><span class="lamp-label">Home</span></button>
      <button class="lamp-item" data-tab="pages" onclick="showSection('pages',this)"><span class="lamp-ico">&#128196;</span><span class="lamp-label">Pages</span></button>
      <button class="lamp-item" data-tab="builder" onclick="showSection('builder',this)"><span class="lamp-ico">&#10024;</span><span class="lamp-label">Builder</span></button>
    </nav>
  </div>
  <div></div>
</div>

<main>

<!-- HOME -->
<div id="home" class="section active">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="newPageFromHome()">+ New Page</button>
      <button class="btn btn-secondary" onclick="showSection('pages')">View All Pages</button>
    </div>
    <p class="hero-note" style="margin:0">Interactive preview with placeholder pages and copy — no real Scholastic campaign data is used.</p>
  </div>

  <div class="stats-card" id="statsCard"></div>

  <div class="card">
    <div class="card-title">Recently Updated</div>
    <div id="recentPagesTable"></div>
  </div>
</div>

<!-- PAGES -->
<div id="pages" class="section">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-wrap">
        <span class="search-icon">&#8981;</span>
        <input type="text" id="pageSearch" placeholder="Search title or slug…" oninput="renderPagesTable()">
      </div>
      <select id="statusFilter" onchange="renderPagesTable()">
        <option value="">All statuses</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>
      <select id="sortKey" onchange="renderPagesTable()">
        <option value="updated-desc">Updated &#8595;</option>
        <option value="title-asc">Title A&#8211;Z</option>
        <option value="sections-desc">Most sections</option>

    <button class="btn btn-secondary btn-sm" onclick="newPageFromHome()">+ New Page</button>

</div>

<!-- BUILDER -->
<div id="builder" class="section">
  <div class="builder-toolbar">
    <div class="builder-title">
      <div id="builderPageTitle">—</div>

    </div>
    <span class="status-badge" id="builderStatusBadge"></span>
    <div class="viewport-toggle">
      <button id="vpDesktop" class="active" onclick="setViewport('desktop')">&#128421; Desktop</button>
      <button id="vpMobile" onclick="setViewport('mobile')">&#128241; Mobile</button>

        <div class="editor-panel-title">
          <span class="bar"></span>
          <div class="editor-panel-title-text">
            Page Builder
            <span class="editor-sel-badge" id="editorSelBadge" style="display:none"></span>
          </div>
        </div>
        <div class="editor-panel-actions">
          <button class="editor-icon-btn" id="resetSectionBtn" title="Reset section to default" onclick="resetSection()" disabled>&#8635;</button>
        </div>
      </div>
      <div class="editor-tabbar">
        <button class="editor-tabbtn" id="tabContent" onclick="setEditTab('content')">&#128221; Content</button>
        <button class="editor-tabbtn" id="tabStyle" onclick="setEditTab('style')">&#127912; Style</button>

</main>

<!-- PAGE DETAIL PANEL -->
<div class="overlay" id="pageOverlay" onclick="closePageDetail()"></div>
<div class="detail-panel" id="pageDetailPanel">
  <div id="pageDetailBody"></div>
</div>


<div class="toast" id="toast"></div>

<script>
// ── SECTION LIBRARY ─────────────────────────────────────────────────────
const LIB = {
  hero:      {label:'Hero Banner',    comp:'sections.hero-banner',          icon:'&#127775;'},
  cards:     {label:'Feature Cards',  comp:'sections.sections-feature-cards',icon:'&#128193;'},
  rich:      {label:'Rich Text',      comp:'sections.sections-rich-text',    icon:'&#128221;'},
  callout:   {label:'Callout',        comp:'sections.callout',               icon:'&#128161;'},
  testi:     {label:'Testimonials',   comp:'sections.testimonials',          icon:'&#128172;'},
  books:     {label:'Book Gallery',   comp:'sections.book-gallery',          icon:'&#128218;'},
  cta:       {label:'CTA Banner',     comp:'sections.banner-strip',          icon:'&#128227;'},
  form:      {label:'Sign-up Form',   comp:'sections.form',                  icon:'&#129534;'},
  image:     {label:'Image',          comp:'sections.image',                 icon:'&#128444;'},
};

function defaultContent(type){
  switch(type){
    case 'hero': return {heading:'New Hero Banner', subheading:'Add a short supporting line here.', button:'Learn More'};
    case 'cards': return {heading:'Feature Cards', cards:[{icon:'&#128218;',title:'Feature One',text:'Short description.'},{icon:'&#127775;',title:'Feature Two',text:'Short description.'},{icon:'&#127942;',title:'Feature Three',text:'Short description.'}]};
    case 'rich': return {heading:'Section Heading', body:'Write a paragraph of supporting copy here. This block is fully rich-text editable in the real builder.'};
    case 'callout': return {heading:'Good to know', body:'Add an important note or FAQ answer here.'};
    case 'testi': return {quote:'This made such a difference for our classroom.', who:'A Teacher, Some Primary School'};
    case 'books': return {heading:'Featured Titles', items:[{t:'Title One',a:'Author A'},{t:'Title Two',a:'Author B'},{t:'Title Three',a:'Author C'},{t:'Title Four',a:'Author D'}]};
    case 'cta': return {heading:'Ready to get involved?', button:'Get Started'};
    case 'form': return {heading:'Sign Up', button:'Submit'};
    case 'image': return {src:'', alt:'', caption:''};
  }
}

// ── Style / Spacing defaults ────────────────────────────────────────────
const BG_GRADIENTS = {red:['#DC2626','#7F1D1D'], navy:['#1E3A8A','#0F172A'], green:['#166534','#052E1C'], amber:['#B45309','#78350F']};
const CTA_BG = {dark:'#1C1917', red:'#7F1D1D', navy:'#0F172A'};
const ACCENT_COLORS = {red:'#DC2626', navy:'#1E3A8A', green:'#166534', amber:'#B45309'};
const TINTS = {light:'#FAFAF9', soft:'#FEF2F2'};
const TONE_BASE = {info:'#93C5FD', warn:'#F59E0B', success:'#4ADE80'};
const HEADING_COLOR_DEFAULTS = {hero:'#FFFFFF', cards:'#1C1917', rich:'#1C1917', callout:'#1C1917', testi:'#292524', books:'#1C1917', cta:'#FFFFFF', form:'#1C1917'};
const HEADING_SIZE_DEFAULTS = {hero:26, cards:17, rich:18, callout:13, testi:15, books:17, cta:16, form:14};

// ── Fonts (matches the real PageChatbox.tsx font preset list) ──────────
const FONT_STACKS = {
  '': "-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,Helvetica,sans-serif",
  nunito: "'Nunito',sans-serif",
  quicksand: "'Quicksand',sans-serif",
  poppins: "'Poppins',sans-serif",
  merriweather: "'Merriweather',serif",
  inter: "'Inter',sans-serif",
  montserrat: "'Montserrat',sans-serif",
  raleway: "'Raleway',sans-serif",
  lato: "'Lato',sans-serif",
  'playfair display': "'Playfair Display',serif",
  oswald: "'Oswald',sans-serif",
};
const FONT_OPTIONS = [
  {v:'', label:'Default'},
  {v:'nunito', label:'Nunito'},
  {v:'quicksand', label:'Quicksand'},
  {v:'poppins', label:'Poppins'},
  {v:'merriweather', label:'Merriweather'},
  {v:'inter', label:'Inter'},
  {v:'montserrat', label:'Montserrat'},
  {v:'raleway', label:'Raleway'},
  {v:'lato', label:'Lato'},
  {v:'playfair display', label:'Playfair Display'},
  {v:'oswald', label:'Oswald'},
];

// ── Color helpers (for the custom color wheel) ──────────────────────────
function hexToRgb(hex){
  hex = (hex||'#000000').replace('#','');
  if (hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function hexToRgba(hex, alpha){
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function darken(hex, amt){
  const {r,g,b} = hexToRgb(hex);
  return rgbToHex(r*(1-amt), g*(1-amt), b*(1-amt));
}
function lighten(hex, amt){
  const {r,g,b} = hexToRgb(hex);
  return rgbToHex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt);
}
function resolveColor(val, dict, fallbackKey){
  if (val && val.startsWith('#')) return val;
  return dict[val] || dict[fallbackKey];
}

function defaultStyle(type){
  const base = {font:''};
  switch(type){
    case 'hero': return {...base, bg:'red', align:'center'};
    case 'cards': return {...base, accent:'red', variant:'imagetop'};
    case 'rich': return {...base, align:'left'};
    case 'callout': return {...base, tone:'info'};
    case 'testi': return {...base, accent:'red'};
    case 'books': return {...base, tint:'light'};
    case 'cta': return {...base, bg:'dark'};
    case 'form': return {...base, tint:'light'};
    case 'image': return {...base};
    default: return base;
  }
}
function defaultSpacing(type){
  const pad = {hero:44, cards:26, rich:26, callout:18, testi:20, books:26, cta:26, form:20}[type] ?? 24;
  return {paddingTop:pad, paddingBottom:pad, marginBottom:0};
}
function spacingCss(s){
  const sp = s.spacing || {};
  return `padding-top:${sp.paddingTop}px;padding-bottom:${sp.paddingBottom}px;margin-bottom:${sp.marginBottom}px;`;
}
function fontCss(s){
  const font = (s.style && s.style.font) || '';
  return `font-family:${FONT_STACKS[font] || FONT_STACKS['']};`;
}
function bgImageCss(s){
  const st = s.style || {};
  if (!st.bgImage) return '';
  const overlay = st.overlayOpacity!=null ? st.overlayOpacity : 0.35;
  const fit = st.bgFit || 'cover';
  const posX = st.bgPositionX!=null ? st.bgPositionX : 50;
  const posY = st.bgPositionY!=null ? st.bgPositionY : 50;
  const scale = st.bgScale!=null ? st.bgScale : 100;
  const size = fit==='contain' ? 'contain' : fit==='fill' ? `${scale}% ${scale}%` : `${scale}%`;
  return `background-image:linear-gradient(rgba(0,0,0,${overlay}),rgba(0,0,0,${overlay})),url('${st.bgImage}');background-size:${size};background-position:${posX}% ${posY}%;background-repeat:no-repeat;`;
}
function photoBgClass(s){ return (s.style && s.style.bgImage) ? ' has-photo-bg' : ''; }
function cardImgTagStyle(card){
  const fit = card.imgFit || 'cover';
  const posX = card.imgPositionX!=null ? card.imgPositionX : 50;
  const posY = card.imgPositionY!=null ? card.imgPositionY : 50;
  const scale = card.imgScale!=null ? card.imgScale : 100;
  return `object-fit:${fit};object-position:${posX}% ${posY}%;transform:scale(${scale/100});`;
}
function cardImgBgStyle(card){
  const fit = card.imgFit || 'cover';
  const posX = card.imgPositionX!=null ? card.imgPositionX : 50;
  const posY = card.imgPositionY!=null ? card.imgPositionY : 50;
  const scale = card.imgScale!=null ? card.imgScale : 100;
  const size = fit==='contain' ? 'contain' : fit==='fill' ? `${scale}% ${scale}%` : `${scale}%`;
  return `background-image:url('${card.img}');background-size:${size};background-position:${posX}% ${posY}%;background-repeat:no-repeat;`;
}
function headingCss(s){
  const st = s.style || {};
  let css = '';
  if (st.headingColor) css += `color:${st.headingColor};`;
  if (st.headingSize) css += `font-size:${st.headingSize}px;`;
  if (st.headingWeight) css += `font-weight:${st.headingWeight};`;
  return css;
}

function renderSectionHTML(s){
  const c = s.content, st = s.style || {};
  switch(s.type){
    case 'hero': {
      const base = resolveColor(st.bg, ACCENT_COLORS, 'red');
      const g = (st.bg && st.bg.startsWith('#')) ? [base, darken(base,0.42)] : (BG_GRADIENTS[st.bg] || BG_GRADIENTS.red);
      const align = st.align || 'center';
      const sideMargin = align==='left' ? '0' : 'auto';
      const btnBg = st.buttonBg || '#FFFFFF';
      const btnText = st.buttonText || darken(base, 0.3);
      const btnBorder = st.buttonBorderColor ? `border:1.5px solid ${st.buttonBorderColor};` : '';
      const btnRadius = st.buttonRadius!=null ? st.buttonRadius : 7;
      const btnFontSize = st.buttonFontSize || 13;
      const btnPad = st.buttonPadding!=null ? st.buttonPadding : 9;
      const btnBgCss = st.buttonGlass ? `backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:${hexToRgba(btnBg,0.55)};` : `background:${btnBg};`;
      const btnClass = 'hero-btn-'+s.id;
      const hoverStyleTag = st.buttonHoverBg ? `<style>.${btnClass}:hover{background:${st.buttonHoverBg} !important;}</style>` : '';
      return `${hoverStyleTag}<div class="sec-hero${photoBgClass(s)}" style="background:linear-gradient(135deg,${g[0]},${g[1]});text-align:${align};${fontCss(s)}${spacingCss(s)}${bgImageCss(s)}"><h1 style="${headingCss(s)}">${esc(c.heading)}</h1><p style="margin-left:${sideMargin};margin-right:${sideMargin}">${esc(c.subheading)}</p><button class="btn ${btnClass}" style="${btnBgCss}color:${btnText};${btnBorder}border-radius:${btnRadius}px;font-size:${btnFontSize}px;padding:${btnPad}px ${btnPad*2}px;">${esc(c.button)}</button></div>`;
    }
    case 'cards': {
      const accent = resolveColor(st.accent, ACCENT_COLORS, 'red');
      const variant = st.variant || 'imagetop';
      const cardHtml = (card,i) => {
        if (variant==='imagetop'){
          return `<div class="mini-card mini-card-imagetop">${card.img ? `<img src="${card.img}" class="mini-card-img" style="${cardImgTagStyle(card)}">` : `<div class="mini-card-img-empty">&#128444;&#65039;</div>`}<div class="mini-card-body"><h4>${esc(card.title)}</h4><p>${esc(card.text)}</p></div></div>`;
        }
        if (variant==='hover'){
          const bgStyle = card.img ? cardImgBgStyle(card) : '';
          return `<div class="mini-card mini-card-hover" style="${bgStyle}"><div class="hover-scrim"></div><div class="hover-text">${card.text ? `<p class="hover-sub">${esc(card.text)}</p>` : ''}<h4>${esc(card.title)}</h4></div></div>`;
        }
        if (variant==='wide'){
          const wideMedia = card.img
            ? `<div class="mini-card-wide-img-wrap"><img src="${card.img}" class="mini-card-wide-img" style="${cardImgTagStyle(card)}"></div>`
            : `<div class="mini-card-wide-img mini-card-img-empty">${card.icon || '&#128444;&#65039;'}</div>`;
          return `<div class="mini-card mini-card-wide">${wideMedia}<div class="mini-card-body"><h4>${esc(card.title)}</h4><p>${esc(card.text)}</p></div></div>`;
        }
        if (variant==='testimonial'){
          return `<div class="mini-card mini-card-testimonial" style="border-left-color:${accent}"><blockquote>&ldquo;${esc(card.text)}&rdquo;</blockquote><div class="who">${esc(card.title)}</div></div>`;
        }
        return `<div class="mini-card" style="border-top:3px solid ${accent}"><div class="ico">${card.icon}</div><h4>${esc(card.title)}</h4><p>${esc(card.text)}</p></div>`;
      };
      return `<div class="sec-pad${photoBgClass(s)}" style="${fontCss(s)}${spacingCss(s)}${bgImageCss(s)}"><h2 style="font-size:17px;font-weight:800;margin-bottom:14px;text-align:center;${headingCss(s)}">${esc(c.heading)}</h2><div class="sec-cards sec-cards-${variant}">${c.cards.map(cardHtml).join('')}</div></div>`;
    }
    case 'rich':
      return `<div class="sec-pad sec-rich${photoBgClass(s)}" style="text-align:${st.align||'left'};${fontCss(s)}${spacingCss(s)}${bgImageCss(s)}"><h2 style="${headingCss(s)}">${esc(c.heading)}</h2><p>${esc(c.body)}</p></div>`;
    case 'callout': {
      if (st.bgImage){
        return `<div class="sec-callout has-photo-bg" style="${fontCss(s)}${spacingCss(s)}${bgImageCss(s)}"><h4 style="${headingCss(s)}">${esc(c.heading)}</h4><p>${esc(c.body)}</p></div>`;
      }
      if (st.tone && st.tone.startsWith('#')){
        return `<div class="sec-callout" style="background:${lighten(st.tone,0.88)};border:1.5px solid ${st.tone};${fontCss(s)}${spacingCss(s)}"><h4 style="color:${darken(st.tone,0.3)};${headingCss(s)}">${esc(c.heading)}</h4><p>${esc(c.body)}</p></div>`;
      }
      return `<div class="sec-callout tone-${st.tone||'info'}" style="${fontCss(s)}${spacingCss(s)}"><h4 style="${headingCss(s)}">${esc(c.heading)}</h4><p>${esc(c.body)}</p></div>`;
    }
    case 'testi': {
      const accent = resolveColor(st.accent, ACCENT_COLORS, 'red');
      return `<div class="sec-testi${photoBgClass(s)}" style="border-left-color:${accent};${fontCss(s)}${spacingCss(s)}${bgImageCss(s)}"><blockquote style="${headingCss(s)}">&ldquo;${esc(c.quote)}&rdquo;</blockquote><div class="who">${esc(c.who)}</div></div>`;
    }
    case 'books': {
      const tint = resolveColor(st.tint, TINTS, 'light');

        <span class="action-link danger" onclick="event.stopPropagation();deletePage('${p.id}')">Delete</span>
      </div></td>

    <tbody>${rows || '<tr><td colspan="6" class="faint" style="padding:20px">No pages found.</td></tr>'}</tbody></table>`;
}
function renderPagesTable(){
  const q = (document.getElementById('pageSearch')?.value||'').toLowerCase();
  const statusF = document.getElementById('statusFilter')?.value||'';
  const sortKey = document.getElementById('sortKey')?.value||'updated-desc';
  let list = PAGES.filter(p => (!q || p.title.toLowerCase().includes(q) || p.slug.toLowerCase().includes(q)) && (!statusF || p.status===statusF));
  list = [...list].sort((a,b)=>{
    if (sortKey==='title-asc') return a.title.localeCompare(b.title);
    if (sortKey==='sections-desc') return b.sections.length - a.sections.length;
    return new Date(b.updatedAt)-new Date(a.updatedAt);
  });
  document.getElementById('pagesTableFull').innerHTML = pagesTableHtml(list);
}

function duplicateSection(id){
  const p = currentPage();
  const idx = p.sections.findIndex(s=>s.id===id);
  if (idx<0) return;

// drag reorder
function dragStart(e,id){ dragSrcId = id; e.currentTarget.classList.add('dragging'); }
function dragOver(e,overId){
  e.preventDefault();
  if (overId===dragSrcId) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height/2;
  e.currentTarget.classList.toggle('drag-over-top', before);
  e.currentTarget.classList.toggle('drag-over-bottom', !before);
}
function dragLeave(e){ e.currentTarget.classList.remove('drag-over-top','drag-over-bottom'); }
function dropSection(e,overId){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over-top','drag-over-bottom');
  if (!dragSrcId || overId===dragSrcId) return;
  const p = currentPage();
  const from = p.sections.findIndex(s=>s.id===dragSrcId);
  let to = p.sections.findIndex(s=>s.id===overId);
  if (from<0 || to<0) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height/2;
  const [moved] = p.sections.splice(from,1);
  to = p.sections.findIndex(s=>s.id===overId);
  p.sections.splice(before ? to : to+1, 0, moved);
  renderCanvas();
}
function dragEnd(){ document.querySelectorAll('.section-block').forEach(el=>el.classList.remove('dragging','drag-over-top','drag-over-bottom')); dragSrcId=null; }

function findSection(id){ return currentPage().sections.find(s=>s.id===id); }

let cardGroupOpen = {};
function resetCardGroups(){ cardGroupOpen = {}; }
function toggleCardGroup(i, btn){
  cardGroupOpen[i] = !cardGroupOpen[i];
  btn.parentElement.classList.toggle('collapsed', !cardGroupOpen[i]);
}
function selectSection(id){
  if (id !== selectedSectionId){ resetStyleGroups(); resetCardGroups(); }
  selectedSectionId = id;
  editSubTab = 'content';
  renderCanvas();
  renderEditorPanel();
}
function setEditTab(tab){
  editSubTab = tab;
  renderEditorPanel();
}
function resetSection(){
  if (!selectedSectionId) return;
  const p = currentPage();
  const idx = p.sections.findIndex(s=>s.id===selectedSectionId);
  if (idx<0) return;
  const old = p.sections[idx];
  p.sections[idx] = {id:old.id, type:old.type, visible:old.visible, content:defaultContent(old.type), style:defaultStyle(old.type), spacing:defaultSpacing(old.type)};
  renderCanvas();
  renderEditorPanel();
  toast('Section reset to default');
}

function renderEditorPanel(){
  const s = selectedSectionId ? findSection(selectedSectionId) : null;
  document.getElementById('tabContent').classList.toggle('active', editSubTab==='content');
  document.getElementById('tabStyle').classList.toggle('active', editSubTab==='style');
  document.getElementById('tabSpacing').classList.toggle('active', editSubTab==='spacing');
  document.getElementById('resetSectionBtn').disabled = !s;
  const badge = document.getElementById('editorSelBadge');
  if (s){ badge.style.display='inline-block'; badge.textContent = LIB[s.type].comp; }
  else { badge.style.display='none'; }
  document.getElementById('editorPanelBody').innerHTML = !s
    ? `<div class="editor-empty"><div class="ico">&#8598;</div><div style="font-weight:800;color:#1C1917;margin-bottom:6px">Select a section on the canvas</div>to start editing its content, style, and spacing.</div>`
    : `<div class="editor-body">${editSubTab==='content' ? renderContentTab(s) : editSubTab==='style' ? renderStyleTab(s) : renderSpacingTab(s)}</div>`;
}

// ── Content tab ──────────────────────────────────────────────────────
function renderContentTab(s){
  const c = s.content;
  switch(s.type){
    case 'hero':
      return fieldHtml('heading','Heading',c.heading) + fieldHtml('subheading','Subheading',c.subheading,'textarea') + fieldHtml('button','Button Text',c.button);
    case 'cards': {
      const variant = (s.style && s.style.variant) || 'imagetop';
      const showImageUpload = variant==='imagetop' || variant==='wide' || variant==='hover';
      const titleLabel = variant==='testimonial' ? 'Attribution' : 'Title';
      const textLabel = variant==='testimonial' ? 'Quote' : variant==='hover' ? 'Subtitle (optional)' : 'Text';
      const textFieldType = variant==='hover' ? undefined : 'textarea';
      return fieldHtml('heading','Section Heading',c.heading) + c.cards.map((card,i)=>{
        const open = cardGroupOpen[i];
        return `<div class="card-group${open?'':' collapsed'}">
          <button type="button" class="card-group-title" onclick="toggleCardGroup(${i}, this)">
            <span>Card ${i+1}</span><span class="card-group-chevron">&#9656;</span>
          </button>
          <div class="card-group-body">${showImageUpload ? cardImageUploadHtml(i,card) : ''}${fieldHtml('card'+i+'title',titleLabel,card.title)}${fieldHtml('card'+i+'text',textLabel,card.text,textFieldType)}</div>
        </div>`;
      }).join('');
    }
    case 'rich':
      return fieldHtml('heading','Heading',c.heading) + fieldHtml('body','Body Text',c.body,'textarea');
    case 'callout':
      return fieldHtml('heading','Heading',c.heading) + fieldHtml('body','Body Text',c.body,'textarea');
    case 'testi':
      return fieldHtml('quote','Quote',c.quote,'textarea') + fieldHtml('who','Attribution',c.who);
    case 'books':
      return fieldHtml('heading','Section Heading',c.heading) + `<p class="style-note">Book covers are pulled from the Media Library in the real builder.</p>`;
    case 'cta':
      return fieldHtml('heading','Heading',c.heading) + fieldHtml('button','Button Text',c.button);
    case 'form':
      return fieldHtml('heading','Heading',c.heading) + fieldHtml('button','Button Text',c.button) + `<p class="style-note">Fields are managed from the Forms view in the real builder.</p>`;
    case 'image':
      return `<div class="edit-field"><label>Image</label>
        <div class="img-upload-zone" onclick="document.getElementById('ef-imgfile').click()">
          ${c.src ? `<img src="${c.src}" alt="">` : `<div class="img-upload-empty"><span class="ico">&#128247;</span>Click to upload an image</div>`}
        </div>
        <input type="file" id="ef-imgfile" accept="image/*" style="display:none" onchange="onImageFileChange(this)">
        ${c.src ? `<button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="clearImage()">Remove Image</button>` : ''}
      </div>` + fieldHtml('alt','Alt Text',c.alt) + fieldHtml('caption','Caption (optional)',c.caption);
  }
}
function fieldHtml(key,label,val,type){
  const tag = type==='textarea' ? `<textarea id="ef-${key}" rows="3" oninput="applyEdit()">${esc(val)}</textarea>` : `<input type="text" id="ef-${key}" value="${esc(val)}" oninput="applyEdit()">`;
  return `<div class="edit-field"><label>${label}</label>${tag}</div>`;
}
function applyEdit(){
  const s = findSection(selectedSectionId);
  if (!s) return;
  const c = s.content;
  const getVal = k => { const el = document.getElementById('ef-'+k); return el ? el.value : undefined; };
  switch(s.type){
    case 'hero': c.heading=getVal('heading'); c.subheading=getVal('subheading'); c.button=getVal('button'); break;
    case 'cards':
      c.heading=getVal('heading');
      c.cards.forEach((card,i)=>{ card.title=getVal('card'+i+'title'); card.text=getVal('card'+i+'text'); });
      break;
    case 'rich': c.heading=getVal('heading'); c.body=getVal('body'); break;
    case 'callout': c.heading=getVal('heading'); c.body=getVal('body'); break;
    case 'testi': c.quote=getVal('quote'); c.who=getVal('who'); break;
    case 'books': c.heading=getVal('heading'); break;
    case 'cta': c.heading=getVal('heading'); c.button=getVal('button'); break;
    case 'form': c.heading=getVal('heading'); c.button=getVal('button'); break;
    case 'image': c.alt=getVal('alt'); c.caption=getVal('caption'); break;
  }
  renderCanvas();
}
function cardImageUploadHtml(i, card){
  const src = card.img;
  return `<div class="edit-field"><label>Card Image</label>
    <div class="img-upload-zone" onclick="document.getElementById('ef-cardimgfile${i}').click()">
      ${src ? `<img src="${src}" alt="">` : `<div class="img-upload-empty"><span class="ico">&#128247;</span>Click to upload</div>`}
    </div>
    <input type="file" id="ef-cardimgfile${i}" accept="image/*" style="display:none" onchange="onCardImageFileChange(this,${i})">
    ${src ? `<button class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="clearCardImage(${i})">Remove</button>` : ''}
  </div>${cardImgAdjustFields(i, card)}`;
}
function imageContentAdjustFields(s){
  const c = s.content, st = s.style || {};
  if (!c.src) return '';
  const fit = st.imgFit || 'cover';
  const height = st.imgHeight || 0;
  const posX = st.imgPositionX!=null ? st.imgPositionX : 50;
  const posY = st.imgPositionY!=null ? st.imgPositionY : 50;
  const scale = st.imgScale!=null ? st.imgScale : 100;
  return styleRangeField('imgHeight','Display Height (0 = Auto)', height, 0, 500, 'px')
    + `<div class="edit-field"><label>Image Fit</label><select onchange="setStyleField('imgFit', this.value)">
      <option value="cover" ${fit==='cover'?'selected':''}>Cover</option>
      <option value="contain" ${fit==='contain'?'selected':''}>Contain</option>
      <option value="fill" ${fit==='fill'?'selected':''}>Fill</option>
    </select></div>`
    + styleRangeField('imgScale','Image Size', scale, 50, 200, '%')
    + styleRangeField('imgPositionX','Horizontal Position', posX, 0, 100, '%')
    + styleRangeField('imgPositionY','Vertical Position', posY, 0, 100, '%');
}
function cardImgAdjustFields(i, card){
  if (!card.img) return '';
  const fit = card.imgFit || 'cover';
  const posX = card.imgPositionX!=null ? card.imgPositionX : 50;
  const posY = card.imgPositionY!=null ? card.imgPositionY : 50;
  const scale = card.imgScale!=null ? card.imgScale : 100;
  return `<div class="edit-field"><label>Image Fit</label><select onchange="setCardImgField(${i},'imgFit', this.value)">
      <option value="cover" ${fit==='cover'?'selected':''}>Cover</option>
      <option value="contain" ${fit==='contain'?'selected':''}>Contain</option>
      <option value="fill" ${fit==='fill'?'selected':''}>Fill</option>
    </select></div>
    ${cardRangeField(i,'imgScale','Image Size', scale, 50, 200, '%')}
    ${cardRangeField(i,'imgPositionX','Horizontal Position', posX, 0, 100, '%')}
    ${cardRangeField(i,'imgPositionY','Vertical Position', posY, 0, 100, '%')}`;
}
function cardRangeField(i,key,label,val,min,max,unit){
  return `<div class="edit-field"><label>${label}</label><div class="range-row"><input type="range" min="${min}" max="${max}" value="${val}" oninput="onCardRangeInput(this,${i},'${key}','${unit}')"><span class="range-val" id="rv-card${i}${key}">${val}${unit}</span></div></div>`;
}
function setCardImgField(i,key,val){
  const s = findSection(selectedSectionId);
  if (!s) return;
  s.content.cards[i][key] = val;
  renderCanvas();
}
function onCardRangeInput(el,i,key,unit){
  const s = findSection(selectedSectionId);
  if (!s) return;
  const val = Number(el.value);
  s.content.cards[i][key] = val;
  const out = document.getElementById('rv-card'+i+key);
  if (out) out.textContent = val+unit;
  renderCanvas();
}
function onCardImageFileChange(el,i){
  const file = el.files && el.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const s = findSection(selectedSectionId);
    if (!s) return;
    s.content.cards[i].img = e.target.result;
    renderCanvas();
    renderEditorPanel();
  };
  reader.readAsDataURL(file);
}
function clearCardImage(i){
  const s = findSection(selectedSectionId);
  if (!s) return;
  delete s.content.cards[i].img;
  renderCanvas();
  renderEditorPanel();
}
function onImageFileChange(el){
  const file = el.files && el.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const s = findSection(selectedSectionId);
    if (!s) return;
    s.content.src = e.target.result;
    renderCanvas();
    renderEditorPanel();
  };
  reader.readAsDataURL(file);
}
function clearImage(){
  const s = findSection(selectedSectionId);
  if (!s) return;
  s.content.src = '';
  renderCanvas();
  renderEditorPanel();
}

// ── Style tab ────────────────────────────────────────────────────────
// Fields are sorted into collapsible categories (Colours / Text / Image / Button) so the
// panel stays short as more controls get added — click a category to open just that one.
let styleGroupOpen = {colours:false, text:false, image:false, button:false};
function resetStyleGroups(){ styleGroupOpen = {colours:false, text:false, image:false, button:false}; }
function toggleStyleGroup(key, btn){
  styleGroupOpen[key] = !styleGroupOpen[key];
  btn.parentElement.classList.toggle('collapsed', !styleGroupOpen[key]);
}
function styleGroup(key, icon, title, bodyHtml){
  if (!bodyHtml || !bodyHtml.trim()) return '';
  const open = styleGroupOpen[key];
  return `<div class="style-group${open ? '' : ' collapsed'}">
    <button type="button" class="style-group-header" onclick="toggleStyleGroup('${key}', this)">
      <span class="style-group-title">${icon} ${title}</span>
      <span class="style-group-chevron">&#9656;</span>
    </button>
    <div class="style-group-body">${bodyHtml}</div>
  </div>`;
}
function renderStyleTab(s){
  const st = s.style;
  let topFields = '', colourFields = '', textFields = '', buttonFields = '';
  switch(s.type){
    case 'hero':
      colourFields = colorWheelField('bg','Background Color', st.bg, ACCENT_COLORS, 'red');
      textFields = alignRow('align', st.align, ['left','center']);
      buttonFields = buttonStyleFields(s);
      break;
    case 'cards':
      topFields = variantRow(st.variant);
      colourFields = colorWheelField('accent','Accent Color', st.accent, ACCENT_COLORS, 'red');
      break;
    case 'rich':
      textFields = alignRow('align', st.align, ['left','center']);
      break;
    case 'callout':
      colourFields = colorWheelField('tone','Color', st.tone, TONE_BASE, 'info');
      break;
    case 'testi':
      colourFields = colorWheelField('accent','Accent Color', st.accent, ACCENT_COLORS, 'red');
      break;
    case 'books':
      colourFields = colorWheelField('tint','Background Color', st.tint, TINTS, 'light');
      break;
    case 'cta':
      colourFields = colorWheelField('bg','Background Color', st.bg, CTA_BG, 'dark');
      break;
    case 'form':
      colourFields = colorWheelField('tint','Background Color', st.tint, TINTS, 'light');
      break;
  }
  textFields += (s.type!=='image' ? headingStyleFields(s) : '') + fontRow(st.font);
  const imageFields = s.type==='image' ? imageContentAdjustFields(s) : bgImageField(s);
  return topFields
    + styleGroup('colours', '&#127912;', 'Colours', colourFields)
    + styleGroup('text', '&#128196;', 'Text', textFields)
    + styleGroup('image', '&#128444;&#65039;', 'Image', imageFields)
    + styleGroup('button', '&#128073;', 'Button', buttonFields);
}
function hexColorField(key,label,current,defaultHex){
  const hex = current || defaultHex;
  return `<div class="edit-field"><label>${label}</label><div class="wheel-row">
    <input type="color" value="${hex}" oninput="onColorWheelInput(this,'${key}')">
  </div></div>`;
}
function styleRangeField(key,label,val,min,max,unit,step){
  unit = unit == null ? 'px' : unit;
  step = step || 1;
  return `<div class="edit-field"><label>${label}</label><div class="range-row"><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="onStyleRangeInput(this,'${key}','${unit}')"><span class="range-val" id="rv-${key}">${val}${unit}</span></div></div>`;
}
function onStyleRangeInput(el,key,unit){
  const s = findSection(selectedSectionId);
  if (!s) return;
  const val = Number(el.value);
  s.style[key] = val;
  const out = document.getElementById('rv-'+key);
  if (out) out.textContent = val+(unit==null?'px':unit);
  renderCanvas();
}
function headingStyleFields(s){
  const st = s.style || {};
  const defColor = HEADING_COLOR_DEFAULTS[s.type] || '#1C1917';
  const defSize = HEADING_SIZE_DEFAULTS[s.type] || 16;
  const weightField = s.type==='hero' ? styleRangeField('headingWeight','Heading Boldness', st.headingWeight || 800, 300, 900, '', 100) : '';
  return `<div class="style-note" style="margin-bottom:8px;margin-top:2px">Heading Typography</div>` +
    hexColorField('headingColor','Heading Color', st.headingColor, defColor) +
    styleRangeField('headingSize','Heading Size', st.headingSize || defSize, 12, 48) +
    weightField;
}
function buttonStyleFields(s){
  const st = s.style || {};
  return hexColorField('buttonBg','Button Background', st.buttonBg, '#FFFFFF') +
    hexColorField('buttonText','Button Text Color', st.buttonText, '#B91C1C') +
    hexColorField('buttonBorderColor','Border Color', st.buttonBorderColor, '#1C1917') +
    styleRangeField('buttonRadius','Corner Radius', st.buttonRadius!=null ? st.buttonRadius : 7, 0, 40) +
    styleRangeField('buttonFontSize','Font Size', st.buttonFontSize || 13, 11, 22) +
    styleRangeField('buttonPadding','Padding', st.buttonPadding!=null ? st.buttonPadding : 9, 4, 24) +
    hexColorField('buttonHoverBg','Hover Background', st.buttonHoverBg, darken(st.buttonBg || '#FFFFFF', 0.15)) +
    `<div class="edit-field"><label class="toggle-row"><input type="checkbox" ${st.buttonGlass?'checked':''} onchange="setStyleField('buttonGlass', this.checked)"> Glass Effect</label></div>`;
}
function bgImageField(s){
  const st = s.style;
  const overlayPct = Math.round((st.overlayOpacity!=null ? st.overlayOpacity : 0.35) * 100);
  const fit = st.bgFit || 'cover';
  const posX = st.bgPositionX!=null ? st.bgPositionX : 50;
  const posY = st.bgPositionY!=null ? st.bgPositionY : 50;
  const scale = st.bgScale!=null ? st.bgScale : 100;
  const imageAdjustFields = st.bgImage ? `
    <div class="edit-field"><label>Image Fit</label><select onchange="setStyleField('bgFit', this.value)">
      <option value="cover" ${fit==='cover'?'selected':''}>Cover</option>
      <option value="contain" ${fit==='contain'?'selected':''}>Contain</option>
      <option value="fill" ${fit==='fill'?'selected':''}>Fill</option>
    </select></div>
    ${styleRangeField('bgScale','Image Size', scale, 50, 200, '%')}
    ${styleRangeField('bgPositionX','Horizontal Position', posX, 0, 100, '%')}
    ${styleRangeField('bgPositionY','Vertical Position', posY, 0, 100, '%')}
  ` : '';
  return `<div class="edit-field"><label>Background Image</label>
    <div class="img-upload-zone" onclick="document.getElementById('ef-bgimgfile').click()">
      ${st.bgImage ? `<img src="${st.bgImage}" alt="">` : `<div class="img-upload-empty"><span class="ico">&#128444;&#65039;</span>Click to upload a background image</div>`}
    </div>
    <input type="file" id="ef-bgimgfile" accept="image/*" style="display:none" onchange="onBgImageFileChange(this)">
    ${st.bgImage ? `<button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="clearBgImage()">Remove Background Image</button>` : ''}
    <p class="style-note">An uploaded image replaces the background color above.</p>
  </div>${imageAdjustFields}${st.bgImage ? `<div class="edit-field"><label>Overlay Darkness</label><div class="range-row"><input type="range" min="0" max="90" value="${overlayPct}" oninput="onBgOverlayInput(this)"><span class="range-val" id="rv-overlayOpacity">${overlayPct}%</span></div></div>` : ''}`;
}
function onBgImageFileChange(el){
  const file = el.files && el.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const s = findSection(selectedSectionId);
    if (!s) return;
    s.style.bgImage = e.target.result;
    if (s.style.overlayOpacity == null) s.style.overlayOpacity = 0.35;
    renderCanvas();
    renderEditorPanel();
  };
  reader.readAsDataURL(file);
}
function clearBgImage(){
  const s = findSection(selectedSectionId);
  if (!s) return;
  delete s.style.bgImage;
  renderCanvas();
  renderEditorPanel();
}
function onBgOverlayInput(el){
  const s = findSection(selectedSectionId);
  if (!s) return;
  const val = Number(el.value)/100;
  s.style.overlayOpacity = val;
  const out = document.getElementById('rv-overlayOpacity');
  if (out) out.textContent = Math.round(val*100)+'%';
  renderCanvas();
}
function alignRow(key,current,opts,label){
  const val = current || opts[0];
  return `<div class="edit-field"><label>${label||'Text Alignment'}</label><div class="seg-row">${opts.map(o=>`<button class="seg-btn${val===o?' active':''}" onclick="setStyleField('${key}','${o}')">${o.charAt(0).toUpperCase()+o.slice(1)}</button>`).join('')}</div></div>`;
}
function variantRow(current){
  const opts = [
    {v:'imagetop', l:'Image Top', ico:'&#128444;&#65039;'},
    {v:'hover', l:'Hover Reveal', ico:'&#128070;'},
    {v:'wide', l:'Wide Card', ico:'&#9636;'},
    {v:'testimonial', l:'Testimonial', ico:'&#128172;'},
  ];
  const val = current || 'imagetop';
  return `<div class="edit-field"><label>Card Style</label><div class="variant-grid">${opts.map(o=>`<button class="variant-btn${val===o.v?' active':''}" onclick="setStyleField('variant','${o.v}')"><span class="variant-ico">${o.ico}</span>${o.l}</button>`).join('')}</div></div>`;
}
function fontRow(current){
  const val = current || '';
  return `<div class="edit-field"><label>Font</label><select onchange="setStyleField('font', this.value)">
    ${FONT_OPTIONS.map(o=>`<option value="${o.v}" ${val===o.v?'selected':''} style="font-family:${FONT_STACKS[o.v]}">${o.label}</option>`).join('')}
  </select></div>`;
}
function colorWheelField(key,label,current,dict,fallbackKey){
  const hex = resolveColor(current, dict, fallbackKey);
  return `<div class="edit-field"><label>${label}</label><div class="wheel-row">
    <input type="color" value="${hex}" oninput="onColorWheelInput(this,'${key}')">
  </div></div>`;
}
function onColorWheelInput(el,key){
  const s = findSection(selectedSectionId);
  if (!s) return;
  s.style[key] = el.value;
  renderCanvas();
}
function setStyleField(key,val){
  const s = findSection(selectedSectionId);
  if (!s) return;
  s.style[key] = val;
  renderCanvas();
  renderEditorPanel();
}

// ── Spacing tab ──────────────────────────────────────────────────────
function renderSpacingTab(s){
  const sp = s.spacing;
  return rangeField('paddingTop','Padding Top', sp.paddingTop, 0, 100) +
    rangeField('paddingBottom','Padding Bottom', sp.paddingBottom, 0, 100) +
    rangeField('marginBottom','Space Below Section', sp.marginBottom, 0, 80);
}
function rangeField(key,label,val,min,max){
  return `<div class="edit-field"><label>${label}</label><div class="range-row"><input type="range" min="${min}" max="${max}" value="${val}" oninput="onSpacingInput(this,'${key}')"><span class="range-val" id="rv-${key}">${val}px</span></div></div>`;
}
function onSpacingInput(el,key){
  const s = findSection(selectedSectionId);
  if (!s) return;
  const val = Number(el.value);
  s.spacing[key] = val;
  const out = document.getElementById('rv-'+key);
  if (out) out.textContent = val+'px';
  renderCanvas();
}

</script>
</body>
</html>
